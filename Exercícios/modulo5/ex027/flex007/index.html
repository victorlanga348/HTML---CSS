<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display: flex;
            background-color: lightsalmon;
        }

        .item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            flex-flow: row wrap;
        }

        #l1{
            order: 0;
        }
        #l2{
            order: 1;
        }
        #l3{
            order: -2;
        }
        #l4{
            order: 5;
        }
        #l5{
            order: -4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="l1">A</div>
        <div class="item" id="l2">B</div>
        <div class="item" id="l3">C</div>
        <div class="item" id="l4">D</div>
        <div class="item" id="l5">E</div>
    </div>
</body>
</html>
