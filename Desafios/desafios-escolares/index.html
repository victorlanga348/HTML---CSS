<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <section>
        <h1>Login</h1>
        <div>
            <input type="text" name="name" id="iname" class="btn" placeholder="Enter your name">
        </div>
        <div>
            <input type="password" name="pass" id="ipass" class="btn" placeholder="Enter your password">
        </div>
        <div id="check">
            <p>
                <input type="checkbox" name="check" id="icheck">
                <label for="icheck">Remeber-me</label>
            </p>
            <p>Forgot password?</p>
        </div>
        <div>
            <input type="submit" value="Login" id="loginBtn" class="btn">
        </div>
        <p>
            Don't have an account? Register
        </p>
    </section>
</body>
</html>
